name: bravely
services:
  bravely-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bravely
      POSTGRES_PASSWORD: bravely-local
      POSTGRES_DB: bravely
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - bravely-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bravely -d bravely']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  bravely-data:

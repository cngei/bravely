name: Build Docker image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Same GitOps flow as sc. Off until cngei/gitops has bravely/bravely-deployment.yaml: set the
  # repository variable GITOPS_ENABLED to true once it does, and add the GITOPS_PUSH_SECRET secret.
  deploy:
    needs: build
    if: vars.GITOPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: cngei/gitops
          token: ${{ secrets.GITOPS_PUSH_SECRET }}
          ref: master
          path: gitops-repo
          fetch-depth: 0
      - name: Update ArgoCD config and push
        run: |
          cd gitops-repo/bravely
          sed -i "s|^\([[:space:]]*image: \).*|\1ghcr.io/cngei/bravely:${{ github.sha }}|" bravely-deployment.yaml
          num_files_updated=$(git diff --numstat | wc -l)
          echo "::notice::${num_files_updated} files were updated"
          if (( num_files_updated > 0 )); then
          git config user.name "GitHub Action"
          git config user.email "servizi.informatici@cngei.it"
          git add .
          git commit -m "Action triggered: Updated Bravely to ${{ github.sha }}"
          git push
          fi
